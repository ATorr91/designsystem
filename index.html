<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BP Design System Oficial</title>
<link rel="icon" href="assets/logo/bluepixel-wordmark.svg">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  /* Visor local del design system: replica el panel "Design System" de Claude Design.
     Lee _ds_manifest.json (cards + templates) y readme.md; no depende de ningún build. */
  :root {
    --bg: #262624;
    --bg-sidebar: #262624;
    --bg-raised: #30302e;
    --bg-hover: #353532;
    --bg-code: #3a3936;
    --border: #45443f;
    --border-soft: #3a3936;
    --text: #faf9f5;
    --text-2: #c2c0b6;
    --text-3: #9c9a92;
    --accent: #d97757;
    --link: #e8825f;
    --btn-bg: #faf9f5;
    --btn-text: #262624;
    --canvas: #1f1e1d;
    --font-ui: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-serif: "Tiempos Headline", "Copernicus", ui-serif, Georgia, "Times New Roman", serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #faf9f5; --bg-sidebar: #faf9f5; --bg-raised: #ffffff; --bg-hover: #f0eee6; --bg-code: #f0eee6;
      --border: #dedcd1; --border-soft: #e8e6dc; --text: #141413; --text-2: #3d3d3a; --text-3: #73726c;
      --link: #c6613f; --btn-bg: #141413; --btn-text: #faf9f5; --canvas: #f0eee6;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; overflow: hidden; }
  button { font: inherit; color: inherit; }

  /* Top bar */
  .topbar { height: 56px; flex: none; display: flex; align-items: center; gap: 18px; padding: 0 12px 0 0; border-bottom: 1px solid var(--border-soft); }
  .tab-ds { margin-left: -1px; height: 38px; padding: 0 15px; border: 1px solid var(--border); border-left: 0; border-radius: 0 8px 8px 0; background: var(--bg-raised); font-weight: 500; font-size: 15px; cursor: pointer; display: flex; align-items: center; }
  .filepick { position: relative; }
  .filepick > button { background: none; border: 0; padding: 4px 8px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 14px; text-align: left; }
  .filepick > button:hover { background: var(--bg-hover); }
  .filepick .t1 { font-size: 15px; font-weight: 500; line-height: 1.25; display: block; max-width: 420px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .filepick .t2 { font-size: 12.5px; color: var(--text-3); display: block; line-height: 1.3; }
  .filepick svg { color: var(--text-3); }
  .menu { position: absolute; top: calc(100% + 6px); left: 0; min-width: 300px; max-height: 70vh; overflow: auto; background: var(--bg-raised); border: 1px solid var(--border); border-radius: 10px; padding: 6px; box-shadow: 0 12px 32px rgba(0,0,0,.35); z-index: 20; display: none; }
  .menu.open { display: block; }
  .menu button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  .menu button:hover, .menu button[aria-current="true"] { background: var(--bg-hover); }
  .menu .mgroup { font-size: 12px; color: var(--text-3); padding: 8px 10px 4px; }
  .spacer { flex: 1; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--bg-hover); color: var(--text-2); font-size: 13px; font-weight: 600; display: grid; place-items: center; }

  /* Layout */
  .body { flex: 1; display: flex; min-height: 0; }
  .sidebar { width: 268px; flex: none; overflow-y: auto; padding: 50px 12px 40px 0; background: var(--bg-sidebar); }
  .main { flex: 1; overflow-y: auto; min-width: 0; }

  .nav-item, .nav-group > button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; cursor: pointer; text-align: left; border-radius: 0 8px 8px 0; color: var(--text-2); }
  .nav-item:hover, .nav-group > button:hover { background: var(--bg-hover); }
  .nav-children .nav-item[aria-current="true"] { background: var(--bg-hover); }
  .nav-top { padding: 6px 12px 6px 6px; font-size: 15.5px; margin-bottom: 22px; }
  .nav-top svg { color: var(--text-3); }
  .nav-group { margin-bottom: 22px; }
  .nav-group > button { padding: 6px 12px 6px 8px; font-size: 15.5px; font-weight: 500; color: var(--text-2); }
  .nav-group > button svg { color: var(--text-3); transition: transform .15s ease; flex: none; }
  .nav-group.collapsed > button svg { transform: rotate(-90deg); }
  .nav-group.collapsed .nav-children { display: none; }
  .nav-children { margin-top: 10px; display: flex; flex-direction: column; gap: 3px; }
  .nav-children .nav-item { padding: 8px 12px 8px 36px; font-size: 15px; color: var(--text-3); line-height: 1.35; }
  .nav-children .nav-item:hover, .nav-children .nav-item[aria-current="true"] { color: var(--text); }

  /* Home */
  .home { max-width: 1400px; padding: 56px 88px 120px 42px; }
  .hero { display: flex; align-items: center; gap: 28px; margin-bottom: 46px; }
  .hero img { width: 134px; height: 90px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); background: #16A1CD; }
  .hero h1 { margin: 0; font: 400 46px/1.1 var(--font-serif); letter-spacing: -0.01em; }

  .section-toggle { display: flex; align-items: center; gap: 10px; border: 0; background: none; cursor: pointer; color: var(--text-2); font-size: 16px; padding: 4px 0 4px 10px; margin-bottom: 20px; }
  .section-toggle svg { color: var(--text-3); transition: transform .15s ease; }
  .section-toggle[aria-expanded="false"] svg { transform: rotate(-90deg); }

  .readme { padding-left: 14px; color: var(--text-2); font-size: 16.5px; line-height: 1.75; max-width: 1340px; }
  .readme[hidden] { display: none; }
  .readme h1, .readme h2, .readme h3 { color: var(--text); font-family: var(--font-ui); line-height: 1.25; }
  .readme h1 { font-size: 26px; font-weight: 600; margin: 0 0 22px; }
  .readme h2 { font-size: 23px; font-weight: 600; margin: 34px 0 16px; }
  .readme h3 { font-size: 18px; font-weight: 600; margin: 28px 0 12px; }
  .readme p { margin: 0 0 16px; }
  .readme strong { color: var(--text); font-weight: 600; }
  .readme a { color: var(--link); text-decoration: none; }
  .readme a:hover { text-decoration: underline; }
  .readme hr { border: 0; border-top: 1px solid var(--border); margin: 26px 0; }
  .readme ul, .readme ol { padding-left: 26px; margin: 0 0 16px; }
  .readme li { margin: 4px 0; }
  .readme code { font-family: var(--font-mono); font-size: .9em; background: var(--bg-code); border: 1px solid var(--border-soft); border-radius: 5px; padding: 1px 7px; color: var(--text-2); overflow-wrap: anywhere; }
  .readme pre { background: var(--bg-code); border-radius: 8px; padding: 14px 16px; overflow: auto; }
  .readme pre code { border: 0; padding: 0; background: none; }
  .readme table { border-collapse: collapse; width: 100%; margin: 8px 0 20px; font-size: 15px; }
  .readme th, .readme td { border: 1px solid var(--border); padding: 9px 12px; text-align: left; vertical-align: top; }
  .readme th { color: var(--text); font-weight: 600; background: var(--bg-raised); }

  .readme-tools { display: flex; flex-wrap: wrap; gap: 12px 28px; margin: 0 0 30px; padding: 0 0 22px; border-bottom: 1px solid var(--border-soft); }
  .tool-group { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .tool-label { font-size: 13px; color: var(--text-3); margin-right: 4px; }
  .tool-btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-raised); color: var(--text); font-size: 14px; cursor: pointer; line-height: 1; }
  .tool-btn:hover { background: var(--bg-hover); }
  .tool-btn svg { color: var(--text-2); }
  .group { scroll-margin-top: 24px; }

  .groups { margin-top: 40px; }
  .group { margin-bottom: 30px; }
  .group-body { padding-left: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 22px; }
  .group-body[hidden] { display: none; }
  .card { border: 1px solid var(--border); border-radius: 12px; background: var(--bg-raised); overflow: hidden; cursor: pointer; text-align: left; padding: 0; display: flex; flex-direction: column; transition: border-color .15s ease; }
  .card:hover { border-color: var(--text-3); }
  .card-frame { position: relative; overflow: hidden; background: #fff; border-bottom: 1px solid var(--border); }
  .card-frame iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; pointer-events: none; background: #fff; }
  .card-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-meta { padding: 12px 14px 14px; }
  .card-name { font-size: 14.5px; font-weight: 500; color: var(--text); }
  .card-sub { font-size: 13px; color: var(--text-3); margin-top: 2px; line-height: 1.4; }

  /* File view */
  .fileview { height: 100%; display: flex; flex-direction: column; }
  .fileview-bar { flex: none; display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--border-soft); }
  .fileview-bar .fname { font-weight: 500; }
  .fileview-bar .fpath { font-family: var(--font-mono); font-size: 12.5px; color: var(--text-3); }
  .fileview-bar a { margin-left: auto; color: var(--text-2); font-size: 13.5px; text-decoration: none; border: 1px solid var(--border); border-radius: 8px; padding: 5px 12px; }
  .fileview-bar a:hover { background: var(--bg-hover); }
  .canvas { flex: 1; min-height: 0; background: var(--canvas); overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 40px; }
  .canvas.full { padding: 0; }
  .canvas .stage { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 6px 24px rgba(0,0,0,.25); flex: none; position: relative; }
  .canvas .stage iframe { border: 0; display: block; transform-origin: 0 0; position: absolute; top: 0; left: 0; }
  .canvas.full .stage { width: 100%; height: 100%; border-radius: 0; box-shadow: none; }
  .canvas.full .stage iframe { position: static; width: 100%; height: 100%; }

  .error { padding: 40px; color: var(--text-3); }

  @media (max-width: 860px) {
    .sidebar { display: none; }
    .home { padding: 32px 16px 80px; }
    .hero h1 { font-size: 32px; }
    .readme, .group-body { padding-left: 0; }
    .section-toggle { padding-left: 0; }
    .group-body { grid-template-columns: 1fr; }
    .readme table { display: block; overflow-x: auto; }
    .filepick .t1 { max-width: 180px; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <button class="tab-ds" id="tabDs">Design System</button>
    <div class="filepick">
      <button id="fileBtn" aria-haspopup="true" aria-expanded="false">
        <span><span class="t1" id="fileTitle">No file open</span><span class="t2" id="fileCount"></span></span>
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6l4 4 4-4"/></svg>
      </button>
      <div class="menu" id="fileMenu" role="menu"></div>
    </div>
    <div class="spacer"></div>
    <div class="avatar" title="alan@bluepixel.mx">A</div>
  </header>
  <div class="body">
    <nav class="sidebar" id="sidebar" aria-label="Design system"></nav>
    <main class="main" id="main"></main>
  </div>

<script>
(async function () {
  const chevron = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6l4 4 4-4"/></svg>';
  const downloadIcon = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2.5v8M4.5 7.5 8 11l3.5-3.5M3 13.5h10"/></svg>';
  const bookIcon ='<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 4.5h5a2.5 2.5 0 0 1 2.5 2.5v9a2 2 0 0 0-2-2h-5.5z"/><path d="M17.5 4.5h-5A2.5 2.5 0 0 0 10 7v9a2 2 0 0 1 2-2h5.5z"/><path d="M4.5 8h3M4.5 10.5h3M12.5 8h3M12.5 10.5h3"/></svg>';
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const sidebar = document.getElementById('sidebar');
  const main = document.getElementById('main');
  const fileTitle = document.getElementById('fileTitle');
  const fileCount = document.getElementById('fileCount');
  const fileBtn = document.getElementById('fileBtn');
  const fileMenu = document.getElementById('fileMenu');

  let manifest, readme;
  try {
    [manifest, readme] = await Promise.all([
      fetch('_ds_manifest.json').then(r => r.json()),
      fetch('readme.md').then(r => r.text()),
    ]);
  } catch (e) {
    main.innerHTML = '<p class="error">No se pudo leer _ds_manifest.json o readme.md. Abre esta página desde el servidor local, no como archivo.</p>';
    return;
  }

  // Páginas navegables: templates + cards, agrupadas como en el manifiesto.
  const pages = [];
  (manifest.templates || []).forEach(t => pages.push({ id: t.entryPath, name: t.name, subtitle: t.description, path: t.entryPath, group: 'Templates', thumb: t.thumbnail && t.thumbnail.path, full: true }));
  (manifest.cards || []).forEach(c => {
    const [w, h] = String(c.viewport || '700x200').split('x').map(Number);
    pages.push({ id: c.path, name: c.name, subtitle: c.subtitle, path: c.path, group: c.group || 'Other', w, h, full: w >= 1200 });
  });
  const groups = [];
  pages.forEach(p => { let g = groups.find(x => x.name === p.group); if (!g) groups.push(g = { name: p.group, items: [] }); g.items.push(p); });
  fileCount.textContent = pages.length + ' pages';

  const collapsed = new Set();

  function renderSidebar(current) {
    let html = `<button class="nav-item nav-top" data-go="" aria-current="${!current}">${bookIcon}<span>Readme</span></button>`;
    groups.forEach(g => {
      html += `<div class="nav-group${collapsed.has(g.name) ? ' collapsed' : ''}"><button data-toggle="${esc(g.name)}" aria-expanded="${!collapsed.has(g.name)}">${chevron}<span>${esc(g.name)}</span></button><div class="nav-children">`;
      g.items.forEach(p => { html += `<button class="nav-item" data-go="${esc(p.id)}" aria-current="${current === p.id}">${esc(p.name)}</button>`; });
      html += '</div></div>';
    });
    sidebar.innerHTML = html;
  }

  function renderMenu(current) {
    let html = `<button data-go="" aria-current="${!current}">Readme</button>`;
    groups.forEach(g => {
      html += `<div class="mgroup">${esc(g.name)}</div>`;
      g.items.forEach(p => { html += `<button data-go="${esc(p.id)}" aria-current="${current === p.id}">${esc(p.name)}</button>`; });
    });
    fileMenu.innerHTML = html;
  }

  function cardHtml(p) {
    const frame = p.thumb
      ? `<div class="card-frame" style="aspect-ratio:16/10"><img src="${esc(p.thumb)}" alt=""></div>`
      : `<div class="card-frame" style="aspect-ratio:${p.w}/${p.h}"><iframe src="${esc(p.path)}" width="${p.w}" height="${p.h}" loading="lazy" tabindex="-1" title="${esc(p.name)}"></iframe></div>`;
    return `<button class="card" data-go="${esc(p.id)}">${frame}<div class="card-meta"><div class="card-name">${esc(p.name)}</div><div class="card-sub">${esc(p.subtitle || '')}</div></div></button>`;
  }

  let readmeOpen = true;
  const groupOpen = {};

  function renderHome() {
    const readmeHtml = window.marked ? marked.parse(readme) : `<pre>${esc(readme)}</pre>`;
    let html = `<div class="home">
      <div class="hero"><img src="${manifest.hasThumbnailHtml ? '.thumbnail' : 'assets/logo/bluepixel-wordmark.svg'}" alt=""><h1>BP Design System Oficial</h1></div>
      <button class="section-toggle" data-section="readme" aria-expanded="${readmeOpen}">${chevron}<span>Readme</span></button>
      <article class="readme"${readmeOpen ? '' : ' hidden'}>
        <div class="readme-tools">
          <div class="tool-group"><span class="tool-label">Descargar</span>
            <button class="tool-btn" data-action="pdf">${downloadIcon}PDF</button>
            <button class="tool-btn" data-action="md">${downloadIcon}.md</button>
          </div>
          <div class="tool-group"><span class="tool-label">Ir a</span>
            <button class="tool-btn" data-jump="Type">Fuentes</button>
            <button class="tool-btn" data-go="components/icons/card-glyphs.html">Galería de iconos</button>
            <button class="tool-btn" data-jump="Components">Galería de componentes</button>
          </div>
        </div>
        ${readmeHtml}
      </article>
      <div class="groups">`;
    groups.forEach(g => {
      const open = groupOpen[g.name] !== false;
      html += `<section class="group" id="group-${esc(g.name)}"><button class="section-toggle" data-section="${esc(g.name)}" aria-expanded="${open}">${chevron}<span>${esc(g.name)}</span></button><div class="group-body"${open ? '' : ' hidden'}>${g.items.map(cardHtml).join('')}</div></section>`;
    });
    html += '</div></div>';
    main.innerHTML = html;
    main.querySelectorAll('.readme a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
    fitCardFrames();
  }

  function fitCardFrames() {
    main.querySelectorAll('.card-frame').forEach(box => {
      const f = box.querySelector('iframe');
      if (!f) return;
      new ResizeObserver(() => { f.style.transform = `scale(${box.clientWidth / Number(f.width)})`; }).observe(box);
    });
  }

  function renderFile(p) {
    main.innerHTML = `<div class="fileview">
      <div class="fileview-bar"><span class="fname">${esc(p.name)}</span><span class="fpath">${esc(p.path)}</span><a href="${esc(p.path)}" target="_blank" rel="noopener">Abrir en pestaña ↗</a></div>
      <div class="canvas${p.full ? ' full' : ''}"><div class="stage"><iframe src="${esc(p.path)}" title="${esc(p.name)}"></iframe></div></div>
    </div>`;
    if (p.full) return;
    const canvas = main.querySelector('.canvas'), stage = main.querySelector('.stage'), f = stage.querySelector('iframe');
    f.width = p.w; f.height = p.h;
    const fit = () => {
      const s = Math.min(1.6, (canvas.clientWidth - 80) / p.w);
      stage.style.width = p.w * s + 'px'; stage.style.height = p.h * s + 'px';
      f.style.transform = `scale(${s})`;
    };
    fit();
    new ResizeObserver(fit).observe(canvas);
  }

  function route() {
    const id = decodeURIComponent(location.hash.slice(1));
    const p = pages.find(x => x.id === id);
    renderSidebar(p && p.id);
    renderMenu(p && p.id);
    fileTitle.textContent = p ? p.name : 'No file open';
    main.scrollTop = 0;
    p ? renderFile(p) : renderHome();
  }

  const go = id => { location.hash = id ? encodeURIComponent(id) : ''; if (!id) history.replaceState(null, '', location.pathname); route(); };

  const fileBase = 'BP-Design-System-Readme';

  function downloadMarkdown() {
    const url = URL.createObjectURL(new Blob([readme], { type: 'text/markdown;charset=utf-8' }));
    const a = Object.assign(document.createElement('a'), { href: url, download: fileBase + '.md' });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // PDF: imprime solo el Readme en un iframe aparte (texto vectorial, seleccionable);
  // el diálogo del navegador ofrece "Guardar como PDF" con el nombre de fileBase.
  function downloadPdf() {
    const f = document.createElement('iframe');
    f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
    f.srcdoc = `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>${fileBase}</title><style>
      @page { size: letter; margin: 0.7in; }
      body { font: 11pt/1.6 -apple-system, "Segoe UI", system-ui, sans-serif; color: #1f1e1d; margin: 0; }
      h1 { font-size: 22pt; margin: 0 0 14pt; } h2 { font-size: 16pt; margin: 22pt 0 8pt; break-after: avoid; } h3 { font-size: 13pt; margin: 16pt 0 6pt; break-after: avoid; }
      p, li { orphans: 3; widows: 3; } a { color: #c6613f; text-decoration: none; }
      code { font: 9.5pt ui-monospace, Menlo, monospace; background: #f0eee6; border-radius: 3px; padding: 0 4px; }
      hr { border: 0; border-top: 1px solid #dedcd1; margin: 18pt 0; }
      table { border-collapse: collapse; width: 100%; font-size: 10pt; } th, td { border: 1px solid #dedcd1; padding: 5pt 7pt; text-align: left; vertical-align: top; } th { background: #f5f4ef; }
      tr { break-inside: avoid; }
    </style></head><body>${window.marked ? marked.parse(readme) : `<pre>${esc(readme)}</pre>`}</body></html>`;
    f.onload = () => {
      const prevTitle = document.title;
      document.title = fileBase;
      f.contentWindow.focus();
      f.contentWindow.print();
      document.title = prevTitle;
      setTimeout(() => f.remove(), 1000);
    };
    document.body.appendChild(f);
  }

  function jumpToGroup(name) {
    if (groupOpen[name] === false) groupOpen[name] = true;
    const sec = document.getElementById('group-' + name);
    if (!sec) return;
    const t = sec.querySelector('.section-toggle');
    t.setAttribute('aria-expanded', 'true');
    sec.querySelector('.group-body').hidden = false;
    const top = main.scrollTop + sec.getBoundingClientRect().top - main.getBoundingClientRect().top - 24;
    main.scrollTo({ top, behavior: 'smooth' });
  }

  document.addEventListener('click', e => {
    const tool = e.target.closest('[data-action],[data-jump]');
    if (tool) {
      const action = tool.getAttribute('data-action');
      if (action === 'md') downloadMarkdown();
      else if (action === 'pdf') downloadPdf();
      else jumpToGroup(tool.getAttribute('data-jump'));
      return;
    }
    const t = e.target.closest('[data-go],[data-toggle],[data-section]');
    if (!t) { if (!e.target.closest('.filepick')) closeMenu(); return; }
    if (t.hasAttribute('data-go')) { closeMenu(); go(t.getAttribute('data-go')); return; }
    if (t.hasAttribute('data-toggle')) {
      const g = t.getAttribute('data-toggle');
      collapsed.has(g) ? collapsed.delete(g) : collapsed.add(g);
      t.parentElement.classList.toggle('collapsed');
      t.setAttribute('aria-expanded', !collapsed.has(g));
      return;
    }
    const s = t.getAttribute('data-section');
    const body = t.nextElementSibling;
    const open = t.getAttribute('aria-expanded') !== 'true';
    t.setAttribute('aria-expanded', open);
    body.hidden = !open;
    if (s === 'readme') readmeOpen = open; else groupOpen[s] = open;
  });

  function closeMenu() { fileMenu.classList.remove('open'); fileBtn.setAttribute('aria-expanded', 'false'); }
  fileBtn.addEventListener('click', e => { e.stopPropagation(); const o = !fileMenu.classList.contains('open'); fileMenu.classList.toggle('open', o); fileBtn.setAttribute('aria-expanded', o); });
  document.getElementById('tabDs').addEventListener('click', () => go(''));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
  window.addEventListener('hashchange', route);

  route();
})();
</script>
</body>
</html>
