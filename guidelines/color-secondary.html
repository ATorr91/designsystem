<!-- @dsCard group="Colors" viewport="700x150" name="Secondary — Accent palette" subtitle="Pantone-mapped playful accents · use sparingly, one at a time" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--bp-font-body)}
  .row{display:flex;height:150px}
  .sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:12px 14px;box-sizing:border-box;color:#fff}
  .sw b{font-family:var(--bp-font-title);font-weight:700;font-size:13px}
  .sw span{font-size:11px;opacity:.85;font-variant-numeric:tabular-nums}
  .dark b,.dark span{color:var(--bp-ink)}
</style></head><body>
  <div class="row">
    <div class="sw" style="background:var(--bp-magenta)"><b>Magenta</b><span>#BE199A · 225 C</span></div>
    <div class="sw dark" style="background:var(--bp-lime)"><b>Lime</b><span>#EDF074 · 100 C</span></div>
    <div class="sw dark" style="background:var(--bp-green)"><b>Green</b><span>#88D465 · 360 C</span></div>
    <div class="sw" style="background:var(--bp-purple)"><b>Purple</b><span>#7A39CD · 266 C</span></div>
    <div class="sw" style="background:var(--bp-cyan)"><b>Mascot Cyan</b><span>#00C1D3 · Pixelios</span></div>
  </div>
</body></html>
