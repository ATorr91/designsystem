<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bp-surface);color:var(--bp-ink);font-family:var(--bp-font-body);
       padding:22px 28px;box-sizing:border-box}
  .lead{font-size:19px;line-height:1.5;max-width:600px}
  .base{font-size:16px;line-height:1.5;color:var(--bp-ink-soft);max-width:600px;margin-top:10px}

</style></head><body>
  <div class="lead">We are a UX/UI &amp; software consultancy. We design and build products people actually enjoy using.</div>
  <div class="base">Open Sans handles every reading surface — paragraphs, form fields, table cells and helper text.</div>
  <div class="cap">Eyebrow label · 0.2em tracking</div>
</body></html>
