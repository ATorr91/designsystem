<!-- @dsCard group="Colors" viewport="700x150" name="Ink & Neutrals" subtitle="Text, dark surfaces and the deep-indigo brand anchor" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--bp-font-body)}
  .row{display:flex;height:150px}
  .sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:12px 14px;box-sizing:border-box;color:#fff}
  .sw b{font-family:var(--bp-font-title);font-weight:700;font-size:13px}
  .sw span{font-size:11px;opacity:.8;font-variant-numeric:tabular-nums}
  .dark b,.dark span{color:var(--bp-ink)}
</style></head><body>
  <div class="row">
    <div class="sw" style="background:var(--bp-ink)"><b>Ink</b><span>#212529</span></div>
    <div class="sw" style="background:var(--bp-ink-soft)"><b>Ink Soft</b><span>#363F4A</span></div>
    <div class="sw" style="background:var(--bp-navy)"><b>Navy</b><span>#1E1C67</span></div>
    <div class="sw" style="background:var(--bp-navy-deep)"><b>Navy Deep</b><span>#12131F</span></div>
    <div class="sw dark" style="background:var(--bp-surface-alt)"><b>Surface Alt</b><span>#F2F3F7</span></div>
    <div class="sw dark" style="background:var(--bp-surface);box-shadow:inset 1px 0 0 var(--bp-border)"><b>White</b><span>#FFFFFF</span></div>
  </div>
</body></html>
