<!-- @dsCard group="Spacing" viewport="700x150" name="Radii & elevation" subtitle="Soft-square corners · indigo-tinted shadows" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bp-surface-alt);color:var(--bp-ink);font-family:var(--bp-font-body);
       height:150px;display:flex;align-items:center;gap:26px;padding:0 32px;box-sizing:border-box}
  .box{background:#fff;width:82px;height:82px;display:flex;align-items:flex-end;justify-content:center;padding:8px;box-sizing:border-box;font-size:11px;font-family:var(--bp-font-title);font-weight:700}
  .l{font-size:10px;color:var(--bp-ink-soft);text-align:center;margin-top:6px}
  .u{display:flex;flex-direction:column;align-items:center}
</style></head><body>
  <div class="u"><div class="box" style="border-radius:var(--bp-radius-sm);box-shadow:var(--bp-shadow-sm)">sm</div><div class="l">4 · shadow-sm</div></div>
  <div class="u"><div class="box" style="border-radius:var(--bp-radius-md);box-shadow:var(--bp-shadow-md)">md</div><div class="l">8 · shadow-md</div></div>
  <div class="u"><div class="box" style="border-radius:var(--bp-radius-lg);box-shadow:var(--bp-shadow-lg)">lg</div><div class="l">16 · shadow-lg</div></div>
  <div class="u"><div class="box" style="border-radius:var(--bp-radius-xl);box-shadow:var(--bp-shadow-blue)">xl</div><div class="l">24 · glow</div></div>
  <div class="u"><div class="box" style="border-radius:var(--bp-radius-pill);width:82px">pill</div><div class="l">999</div></div>
</body></html>
