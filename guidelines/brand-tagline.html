<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;height:180px;background:#fff;display:flex;align-items:center;justify-content:center}
  .stack{width:360px}
  .top{display:flex;align-items:center;gap:12px}
  .pixel{width:38px;height:38px;background:var(--bp-blue);flex:none}
  .wm{height:38px;color:var(--bp-ink)}
  .rule{height:1px;background:var(--bp-ink);margin:14px 0 10px}
  .tag{height:22px;color:var(--bp-ink)}
</style></head><body>
  <div class="stack">
    <div class="top"><div class="pixel"></div><img class="wm" src="../assets/logo/bluepixel-wordmark.svg"></div>
    <div class="rule"></div>
    <img class="tag" src="../assets/logo/tagline-software-that-feels-right.svg">
  </div>
</body></html>
