<!-- @dsCard group="Brand" viewport="700x180" name="Logo — primary lockup" subtitle="Cyan pixel square + BLUE (bold) / PIXEL (light) wordmark" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;height:180px;display:flex}
  .cell{flex:1;display:flex;align-items:center;justify-content:center}
  .lockup{display:flex;align-items:center;gap:14px}
  .pixel{width:44px;height:44px;background:var(--bp-blue);flex:none}
  .wm{height:44px}
</style></head><body>
  <div class="cell" style="background:#fff">
    <div class="lockup"><div class="pixel"></div><img class="wm" src="../assets/logo/bluepixel-wordmark.svg" style="filter:none;color:var(--bp-ink)"></div>
  </div>
  <div class="cell" style="background:var(--bp-navy)">
    <div class="lockup"><div class="pixel"></div><img class="wm" src="../assets/logo/bluepixel-wordmark.svg" style="filter:brightness(0) invert(1)"></div>
  </div>
</body></html>
