<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bp-surface);color:var(--bp-ink);font-family:var(--bp-font-title);
       padding:22px 28px;box-sizing:border-box}
  .h1{font-size:44px;font-weight:700;line-height:1;letter-spacing:-.01em}
  .r{display:flex;gap:28px;margin-top:16px;font-size:22px;align-items:baseline;flex-wrap:wrap}
  .r span{color:var(--bp-ink-soft);font-size:12px;font-family:var(--bp-font-body);margin-left:6px}
</style></head><body>
  <div class="h1">Software that Feels Right</div>
  <div class="r">
    <div style="font-weight:400">Regular<span>400</span></div>
    <div style="font-weight:500">Medium<span>500</span></div>
    <div style="font-weight:700">Bold<span>700</span></div>
    <div style="font-weight:900">Black<span>900</span></div>
  </div>
</body></html>
