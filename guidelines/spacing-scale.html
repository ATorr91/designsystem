<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base · used for padding, gaps & layout rhythm" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bp-surface);color:var(--bp-ink);font-family:var(--bp-font-body);
       height:150px;display:flex;align-items:flex-end;gap:14px;padding:0 28px 22px;box-sizing:border-box}
  .u{display:flex;flex-direction:column;align-items:center;gap:6px}
  .bar{background:var(--bp-blue);width:100%;border-radius:2px}
  .u b{font-size:11px;font-family:var(--bp-font-title);font-weight:700}
  .u span{font-size:10px;color:var(--bp-ink-soft)}
</style></head><body>
  <div class="u" style="width:16px"><div class="bar" style="height:16px"></div><b>1</b><span>4</span></div>
  <div class="u" style="width:22px"><div class="bar" style="height:24px"></div><b>3</b><span>12</span></div>
  <div class="u" style="width:28px"><div class="bar" style="height:32px"></div><b>4</b><span>16</span></div>
  <div class="u" style="width:34px"><div class="bar" style="height:48px"></div><b>5</b><span>24</span></div>
  <div class="u" style="width:40px"><div class="bar" style="height:64px"></div><b>6</b><span>32</span></div>
  <div class="u" style="width:52px"><div class="bar" style="height:80px"></div><b>7</b><span>48</span></div>
  <div class="u" style="width:64px"><div class="bar" style="height:104px"></div><b>8</b><span>64</span></div>
</body></html>
