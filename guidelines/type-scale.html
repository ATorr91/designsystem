<!-- @dsCard group="Type" viewport="700x230" name="Type scale" subtitle="Hero → caption · Red Hat Display titles over Open Sans body" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bp-surface);color:var(--bp-ink);padding:18px 28px;box-sizing:border-box}
  .r{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--bp-border);padding:5px 0}
  .r:last-child{border:0}
  .t{font-family:var(--bp-font-title);font-weight:700;line-height:1.05}
  .n{margin-left:auto;font-family:var(--bp-font-body);font-size:11px;color:var(--bp-ink-soft);font-variant-numeric:tabular-nums}
</style></head><body>
  <div class="r"><div class="t" style="font-size:40px">Hero / H1</div><div class="n">48–64px · 700</div></div>
  <div class="r"><div class="t" style="font-size:30px">Heading H2</div><div class="n">40px · 700</div></div>
  <div class="r"><div class="t" style="font-size:22px">Heading H3</div><div class="n">32px · 700</div></div>
  <div class="r"><div class="t" style="font-size:17px;font-weight:600">Title</div><div class="n">20–24px · 600</div></div>
  <div class="r"><div class="t" style="font-size:15px;font-weight:400;font-family:var(--bp-font-body)">Body — Open Sans</div><div class="n">16px · 400 · 1.5</div></div>
  <div class="r"><div class="t" style="font-size:12px;font-weight:400;font-family:var(--bp-font-body);color:var(--bp-ink-soft)">Caption</div><div class="n">12–14px</div></div>
</body></html>
