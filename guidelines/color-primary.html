<!-- @dsCard group="Colors" viewport="700x150" name="Primary — Pixel Blue" subtitle="Pantone 801 c · the one hue that carries the brand" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--bp-font-body);background:var(--bp-surface);color:var(--bp-ink)}
  .row{display:flex;gap:0;height:150px}
  .sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:12px 14px;box-sizing:border-box}
  .sw b{font-family:var(--bp-font-title);font-weight:700;font-size:13px}
  .sw span{font-size:11px;opacity:.72;font-variant-numeric:tabular-nums}
  .on-dark b,.on-dark span{color:#fff}
</style></head><body>
  <div class="row">
    <div class="sw on-dark" style="background:var(--bp-blue-400)"><b>Blue 400</b><span>#45B8DB · hover</span></div>
    <div class="sw on-dark" style="background:var(--bp-blue);flex:1.8"><b>Pixel Blue</b><span>#16A1CD · Pantone 801 c</span></div>
    <div class="sw on-dark" style="background:var(--bp-blue-600)"><b>Blue 600</b><span>#1288B0 · pressed</span></div>
    <div class="sw" style="background:var(--bp-blue-tint)"><b>Tint 10%</b><span>washes</span></div>
  </div>
</body></html>
